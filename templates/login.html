<!doctype html><html lang="es"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Ingreso · Orquídea Smart</title><style>*{box-sizing:border-box}body{background:#edf4ee;font-family:system-ui,-apple-system,Segoe UI,sans-serif;display:grid;place-items:center;min-height:100vh;margin:0;color:#183e35}main{background:#fff;padding:44px;border-radius:25px;box-shadow:0 20px 70px #15463218;width:min(440px,92%)}h1{font-size:27px;margin:14px 0}p{color:#667a71;line-height:1.6}input,button{width:100%;font:inherit;padding:14px 16px;border-radius:11px}input{border:1px solid #c7d4cd;margin:12px 0}button{background:#205c49;color:white;border:0;cursor:pointer;font-weight:700}small{color:#a33;display:block;margin-top:14px}.logo{font-size:34px}</style></head><body><main><div class="logo">✿</div><h1>Bienvenido a Orquídea Smart</h1><p>Ingresa la contraseña de administración para abrir el panel.</p><form id="f"><input type="password" id="p" aria-label="Contraseña" placeholder="Contraseña de administración" required autofocus><button>Entrar al invernadero →</button></form><small id="err"></small><p style="font-size:13px"><a href="/simulador">Ir al simulador público</a></p></main><script>document.querySelector('#f').onsubmit=async e=>{e.preventDefault();let r=await fetch('/api/login',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({password:document.querySelector('#p').value})});if(r.ok)location.href='/';else document.querySelector('#err').textContent='Contraseña incorrecta.'}</script></body></html>
