services:
  - type: web
    name: orquidea-smart
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/health
    envVars:
      - key: SECRET_KEY
        generateValue: true
      - key: SENSOR_API_KEY
        sync: false
      - key: ADMIN_PASSWORD
        sync: false
      - key: ALLOWED_ORIGINS
        value: '*'
      - key: SECURE_COOKIE
        value: '1'
      - key: NOTIFICATION_EMAIL
        value: orquidea.smart@gmail.com
      - key: NOTIFICATION_TIMEZONE
        value: America/Santiago
      - key: NOTIFICATION_GRACE_MINUTES
        value: '30'
      - key: NOTIFICATION_INTERNAL_WORKER
        value: '1'
      - key: NOTIFICATION_JOB_KEY
        sync: false
      - key: EMAIL_PROVIDER
        value: resend
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: 'Orquídea Smart <onboarding@resend.dev>'
